name: E2E

on:
  push:
    branches:
      - main
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: build-test-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Expose matched filters as job 'src' output variable
      paths: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout (push/workflow_dispatch only)
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - '!**/**.md'
            kubeadm:
              - templates/flavors/kubeadm/default/*
              - e2e/capl-cluster-flavors/kubeadm-capl-cluster/*
            kubeadm-flatcar:
             - templates/flavors/kubeadm/flatcar/*
             - e2e/capl-cluster-flavors/kubeadm-flatcar-vpcless-capl-cluster/*
            cluster-pause:
              - e2e/cluster-pause/*
            dns:
              - templates/flavors/kubeadm/dns-loadbalancing/*
              - e2e/capl-cluster-flavors/kubeadm-dns-lb-cluster/*
              - cloud/services/domains.go

  e2e-test:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.changes.outputs.paths) }}
        exclude:
          - flavor: src
        include:
          - flavor: ${{ github.event.pull_request.number && 'quick' || 'all' }}
    uses: ./.github/workflows/e2e-test.yaml
    secrets: inherit
    with:
      environment: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'prod-external' || 'prod' }}
      e2e-selector: ${{ matrix.flavor }}
      e2e-flags: ${{ matrix.flavor == 'quick' && ''  || '--assert-timeout 20m0s'}}
