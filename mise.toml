[settings]
minimum_release_age = "7d"  # only install versions released more than 7 days ago - https://mise.en.dev/security.html#minimum-release-age

[tools]
go = "1.27.2"
ko = "0.18.1"
kustomize = "5.8.1"
ctlptl = "0.9.0"
clusterctl = "1.12.5"
kubectl = "1.35.5"
kubebuilder = "4.13.1"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "release-0.22"
kube-controller-tools = "0.20.1"
tilt = "0.36.3"
kind = "0.31.0"
"go:github.com/kyverno/chainsaw" = "0.2.15"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
"go:go.uber.org/mock/mockgen" = "0.6.0"
"aqua:hexdigest/gowrap" = "1.4.3"
s5cmd = "2.3.0"
golangci-lint = "2.14.0"
mdbook = "0.5.2"
jq = "1.8.1"
"go:github.com/elastic/crd-ref-docs" = "0.3.0"
"pipx:linode-cli" = "5.68.0"

[tasks.check]
description = "[check] Fast pre-flight: fmt, vet, lint, lint-api. Mutates Go formatting only. Builds bin/golangci-lint-custom on first use."
run = [{ task = "fmt" }, { task = "vet" }, { task = "lint" }, { task = "lint-api" }]

[tasks.doctor]
description = "[check] Read-only: verify tools, env vars, docker, and the active Linode account are ready. Run first in a new environment."
run = "hack/doctor.sh"

[tasks.verify]
description = "[verify] CI-equivalent gate: lint, lint-api, nilcheck, vulncheck, test, build. Stops at the first failure. Mutates generated files and Go formatting."
run = [{ task = "lint" }, { task = "lint-api" }, { task = "nilcheck" }, { task = "vulncheck" }, { task = "test" }, { task = "build" }]

[tasks.fmt]
description = "[check] Format Go sources in place. Mutates Go files."
run = "make fmt"

[tasks.vet]
description = "[check] Run go vet. Read-only."
run = "make vet"

[tasks.lint]
description = "[check] Run golangci-lint. Read-only."
run = "make lint"

[tasks.lint-api]
description = "[verify] Run API linting (kube-api-linter). Read-only; builds bin/golangci-lint-custom on first use."
run = "make lint-api"

[tasks.vulncheck]
description = "[verify] Run govulncheck. Read-only; needs network."
run = "make vulncheck"

[tasks.test]
description = "[verify] Regenerate code, format, vet, then run unit and envtest suites with -race. Mutates generated files and Go formatting. Writes cover.out."
run = "make test"

[tasks.build]
description = "[verify] Regenerate code, format, vet, then build bin/manager. Mutates generated files and Go formatting."
run = "make build"

[tasks.generate]
description = "[dev] Regenerate CRDs, RBAC, webhooks, deepcopy, mocks, and API reference docs. Mutates config/, api/, mock/, docs/src/reference."
run = "make generate"

[tasks.generate-flavors]
description = "[dev] Regenerate cluster templates from templates/flavors into templates/ (git-ignored output)."
run = "make generate-flavors"

[tasks.local-release]
description = "[dev] Rebuild release manifests and templates in infrastructure-local-linode/v0.0.0 (git-ignored; the old output is deleted first). Runs git restore on config/default/*manager_image_patch.yaml, discarding uncommitted edits to those files. Run after changing templates/ or config/."
run = "make local-release"

[tasks.e2etest]
description = "[e2e] Final check after verify passes. Runs generate, local-release (see its warning), local-deploy, then Chainsaw tests on a kind+Tilt cluster. Select tests with E2E_SELECTOR=quick|all|<label> and pass E2E_FLAGS."
run = "make e2etest"

[tasks.check-gen-diff]
description = "[ci] Fails on ANY uncommitted change (git diff --exit-code). Meant for CI after generate; use verify locally."
run = "make check-gen-diff"

[tasks.tidy]
description = "[dev] Run go mod tidy. Mutates go.mod and go.sum; needs network."
run = "make tidy"

[tasks.nilcheck]
description = "[verify] Run nilaway on this module's packages. Read-only; builds bin/golangci-lint-custom on first use."
run = "make nilcheck"

[tasks.docs]
description = "[dev] Serve the mdBook docs on 0.0.0.0:3000 until stopped."
run = "make docs"

[tasks.local-deploy]
description = "[dev] Create the kind management cluster and deploy CAPL with Tilt (tilt ci). Needs Docker."
run = "make local-deploy"

[tasks.tilt-cluster]
description = "[dev] Create the kind cluster and run interactive tilt up until stopped."
run = "make tilt-cluster"

[tasks.test-upgrade]
description = "[e2e] Upgrade test: checks out the last release tag, then back to HEAD (git checkout), and runs Chainsaw. Needs a clean tree. Run only when asked."
run = "make test-upgrade"

[tasks.clean-child-clusters]
description = "[dev] Delete ALL Cluster objects in ALL namespaces of the current kube context (kubectl delete clusters -A --all). Destructive; run only when asked."
run = "make clean-child-clusters"

[tasks.clean-kind-cluster]
description = "[dev] Delete the kind management cluster from .tilt/ctlptl-config.yaml. Destructive."
run = "make clean-kind-cluster"

[tasks.ko-build]
description = "[dev] Build the controller image locally with ko. Does not push."
run = "make ko-build"

[tasks.ko-publish]
description = "[dev] Build and push the controller image to KO_DOCKER_REPO. Publishes; run only when asked."
run = "make ko-publish"
